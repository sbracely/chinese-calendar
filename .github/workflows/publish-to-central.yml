name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java and Maven credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Check tag matches project version
        run: |
          VERSION="$(bash ./mvnw --batch-mode -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $VERSION" >&2
            exit 1
          fi

      - name: Build, sign, and upload release
        run: bash ./mvnw --batch-mode --no-transfer-progress -Prelease clean deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
